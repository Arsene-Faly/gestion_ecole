{% extends "layouts/base.html" %}

{% block titre %}Academic{% endblock %}

{% block titre_header %}Test{% endblock %}

{% block content %}

<!-- Compteurs -->
<section class="section two-cols">

    <div class="card" style="padding: 30px;">
        <h3 style="font-size: 1.4rem; margin-bottom: 20px;">
            Nombre de niveaux
        </h3>

        <p style="font-size: 3.5rem; font-weight: bold; margin: 0;">
            {{ total_levels }}
        </p>
    </div>

    <div class="card" style="padding: 30px;">
        <h3 style="font-size: 1.4rem; margin-bottom: 20px;">
            Nombre total de classes
        </h3>

        <p style="font-size: 3.5rem; font-weight: bold; margin: 0;">
            {{ total_classes }}
        </p>
    </div>

</section>

<!-- Graphique ECharts -->
<section class="section">
    <div class="card" style="padding: 30px;">

        <h2 style="font-size: 1.5rem; margin-bottom: 25px;">
            Nombre de classes par niveau
        </h2>

        <div id="niveauChart"
             style="width: 100%; height: 550px;">
        </div>

    </div>
</section>

<!-- ECharts -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

<script>
    const statistiques = {{ statistiques | tojson }};

    const chart = echarts.init(
        document.getElementById("niveauChart")
    );

    chart.setOption({
        tooltip: {
            trigger: "item",
            formatter: "{b} : {c} classe(s) ({d}%)"
        },

        legend: {
            top: "2%",
            left: "center",
            textStyle: {
                fontSize: 15
            }
        },

        series: [
            {
                name: "Classes par niveau",
                type: "pie",
                radius: ["40%", "75%"],
                center: ["50%", "55%"],

                itemStyle: {
                    borderRadius: 8,
                    borderColor: "#fff",
                    borderWidth: 2
                },

                label: {
                    show: true,
                    formatter: "{b}\n{c} classe(s)",
                    fontSize: 15
                },

                labelLine: {
                    length: 20,
                    length2: 15
                },

                emphasis: {
                    scale: true,
                    scaleSize: 10,
                    label: {
                        show: true,
                        fontSize: 20,
                        fontWeight: "bold"
                    }
                },

                data: statistiques
            }
        ]
    });

    window.addEventListener("resize", () => {
        chart.resize();
    });
</script>

{% endblock %}
